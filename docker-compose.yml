name: iot-lakehouse

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 256m

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]   # host access; containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1536m

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/opt/kafka/bin/kafka-topics.sh
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.raw    --partitions 6 --replication-factor 1
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.dlq    --partitions 1 --replication-factor 1
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.alerts --partitions 1 --replication-factor 1
        $$K --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 512m

  bridge:
    build: ./bridge
    environment:
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      mosquitto: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 256m

  # S3-compatible object storage. Upstream MinIO removed its Docker Hub and Quay images,
  # so this uses the Chainguard build (see docs/adr/004-object-storage-image.md).
  # The image runs as uid 65532; "user: 0" lets it write to the fresh named volume in local dev.
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    mem_limit: 512m

  # Creates the "warehouse" bucket. No shell needed: the client reads its endpoint and
  # credentials from MC_HOST_local, and Compose retries until MinIO is up.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on: [minio]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@minio:9000
      MC_CONFIG_DIR: /tmp/.mc
    command: ["mb", "--ignore-existing", "local/warehouse"]
    restart: on-failure

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    mem_limit: 512m

  # --- Week 2 additions (add when you reach bronze): postgres (Iceberg JDBC catalog),
  # --- spark master/worker, trino. Keep memory limits explicit.

volumes:
  mosquitto-data:
  kafka-data:
  minio-data:
  grafana-data:
