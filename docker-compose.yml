name: iot-lakehouse

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 256m

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1536m

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/opt/kafka/bin/kafka-topics.sh
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.raw --partitions 6 --replication-factor 1
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.dlq --partitions 1 --replication-factor 1
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.alerts --partitions 1 --replication-factor 1
        $$K --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 512m

  bridge:
    build: ./bridge
    environment:
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      mosquitto: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 256m

    # PostgreSQL - Iceberg JDBC catalog
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # S3-compatible object storage
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    mem_limit: 512m

  # Creates the warehouse bucket
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on: [minio]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@minio:9000
      MC_CONFIG_DIR: /tmp/.mc
    command: ["mb", "--ignore-existing", "local/warehouse"]
    restart: on-failure

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: trino-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/provisioning/datasources/trino.yml:/etc/grafana/provisioning/datasources/trino.yml:ro
      - ./monitoring/provisioning/dashboards/iot.yml:/etc/grafana/provisioning/dashboards/iot.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 512m

  # Apache Spark - Bronze streaming processor
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: iot-spark:3.5.9-iceberg-1.12.0
    env_file:
      - .env
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./streaming:/opt/spark-apps
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 3g
    restart: unless-stopped
    command: ["sleep", "infinity"]

  gold:
    profiles: ["stage4"]
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: iot-spark:3.5.9-iceberg-1.12.0
    env_file:
      - .env
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./streaming:/opt/spark-apps
    depends_on:
      spark:
        condition: service_started
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1536m
    restart: unless-stopped
    command:
      ["/opt/spark/bin/spark-submit", "/opt/spark-apps/gold.py", "--refresh-interval-seconds", "60"]

  alerts:
    profiles: ["stage4"]
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: iot-spark:3.5.9-iceberg-1.12.0
    env_file:
      - .env
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./streaming:/opt/spark-apps
    depends_on:
      spark:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1536m
    restart: unless-stopped
    command:
      ["/opt/spark/bin/spark-submit", "/opt/spark-apps/alerts.py", "--poll-interval-seconds", "10"]

    # Trino - SQL query engine
  trino:
    image: trinodb/trino:484
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/node.properties:/etc/trino/node.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
      - trino-data:/data/trino
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 2g
    restart: unless-stopped

volumes:
  mosquitto-data:
  kafka-data:
  minio-data:
  grafana-data:
  postgres-data:
  trino-data: