# Local development broker.
# Hardening (later stage): set allow_anonymous false, add password_file and acl_file.
listener 1883
allow_anonymous true

# Keep queued QoS 1 messages for a persistent subscriber (the bridge) across restarts.
persistence true
persistence_location /mosquitto/data/

# Defaults (1000 queued messages per client) silently drop messages in a burst or while
# the bridge is down. 0 = unlimited; memory is bounded by the container limit instead.
max_queued_messages 0
max_inflight_messages 200

log_dest stdout
